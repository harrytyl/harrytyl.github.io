# this file contains the social media links and usernames of the author
# the socials will be displayed in the order they are defined here
# for more information, please refer to the documentation of jekyll-socials plugin: https://github.com/george-gca/jekyll-socials
cv_pdf: /assets/pdf/website_CV.pdf # path to your CV PDF file
# email is deliberately NOT set here. jekyll-socials writes "mailto:<address>"
# verbatim, which puts the plain address in the HTML for harvesters to scrape,
# and it offers no hook to obfuscate it. The email icon is instead added by
# _includes/footer.liquid from site.email, percent-encoded via encode_email.
# (Pre-encoding the value here does not work: al_search applies encode_email a
# second time, producing a double-encoded, broken mailto in the search palette.)
# inspirehep_id: 1010907 # Inspire HEP author ID
# rss_icon: true # comment this line to hide the RSS icon
scholar_userid: PrF7kHIAAAAJ # your Google Scholar ID
linkedin_username: harrytyl # your LinkedIn username
# wechat_qr: # filename of your wechat qr-code saved as an image (e.g., wechat-qr.png if saved to assets/img/wechat-qr.png)
# whatsapp_number: # your WhatsApp number (full phone number in international format. Omit any zeroes, brackets, or dashes when adding the phone number in international format.)
# custom_social: # can be any name here other than the ones already defined in the jekyll-socials plugin
#   logo: <img src="https://shields.io" alt="LinkedIn" height="40"> # can be png, svg, jpg
#   title: LinkedIn
#   url: https://www.linkedin.com/in/harrytyl
