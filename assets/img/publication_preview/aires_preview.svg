<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>AiRES paper preview image</title>
  <desc>Website preview graphic for AiRES, an EHR-embedded AI model for hospitalisation risk prediction in chronic respiratory disease.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F3A"/>
      <stop offset="0.52" stop-color="#123E59"/>
      <stop offset="1" stop-color="#0E6B6F"/>
    </linearGradient>

    <linearGradient id="card" x1="120" y1="88" x2="1080" y2="542" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="accent" x1="725" y1="160" x2="1040" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE3FF"/>
      <stop offset="1" stop-color="#4EE7B8"/>
    </linearGradient>

    <filter id="shadow" x="80" y="58" width="1040" height="524" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative network dots -->
  <g opacity="0.22">
    <circle cx="1010" cy="90" r="4" fill="#8EF3FF"/>
    <circle cx="1080" cy="155" r="3" fill="#8EF3FF"/>
    <circle cx="940" cy="185" r="3" fill="#8EF3FF"/>
    <circle cx="1030" cy="260" r="5" fill="#8EF3FF"/>
    <circle cx="1120" cy="330" r="3" fill="#8EF3FF"/>
    <line x1="1010" y1="90" x2="1080" y2="155" stroke="#8EF3FF" stroke-width="1.4"/>
    <line x1="1080" y1="155" x2="1030" y2="260" stroke="#8EF3FF" stroke-width="1.4"/>
    <line x1="940" y1="185" x2="1030" y2="260" stroke="#8EF3FF" stroke-width="1.4"/>
    <line x1="1030" y1="260" x2="1120" y2="330" stroke="#8EF3FF" stroke-width="1.4"/>
  </g>

  <!-- Main card -->
  <rect x="120" y="88" width="960" height="454" rx="34" fill="url(#card)" stroke="white" stroke-opacity="0.22" filter="url(#shadow)"/>

  <!-- Left text block -->
  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <rect x="170" y="138" width="172" height="34" rx="17" fill="#4EE7B8" fill-opacity="0.18" stroke="#4EE7B8" stroke-opacity="0.7"/>
    <text x="188" y="160" font-size="16" font-weight="700" fill="#B9FFF0">BMJ Open Protocol</text>

    <text x="170" y="245" font-size="82" font-weight="800" fill="#FFFFFF" letter-spacing="-3">AiRES</text>

    <text x="174" y="287" font-size="25" font-weight="600" fill="#D9F8FF">
      AI in patients with RESpiratory disease
    </text>

    <text x="174" y="340" font-size="28" font-weight="700" fill="#FFFFFF">
      EHR-embedded AI model for
    </text>
    <text x="174" y="378" font-size="28" font-weight="700" fill="#FFFFFF">
      hospitalisation risk prediction
    </text>

    <text x="174" y="426" font-size="20" fill="#C8E8EF">
      Chronic respiratory disease · Asthma · COPD · Multimorbidity
    </text>

    <g>
      <rect x="174" y="461" width="112" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="210" y="489" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">30-day</text>

      <rect x="300" y="461" width="112" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="356" y="489" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">90-day</text>

      <rect x="426" y="461" width="124" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="488" y="489" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">180-day</text>
    </g>
  </g>

  <!-- Right visual panel -->
  <g transform="translate(690 130)">
    <!-- EHR panel -->
    <rect x="10" y="20" width="330" height="360" rx="28" fill="#FFFFFF" fill-opacity="0.13" stroke="#FFFFFF" stroke-opacity="0.24"/>
    <rect x="40" y="58" width="210" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.34"/>
    <rect x="40" y="92" width="260" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="40" y="116" width="230" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.18"/>

    <!-- Lung icon -->
    <g filter="url(#glow)">
      <path d="M163 152 C130 130, 88 148, 77 196 C64 253, 84 304, 124 305 C154 306, 168 276, 168 237 L168 165 C168 159, 166 155, 163 152Z"
            fill="url(#accent)" fill-opacity="0.22" stroke="#85F5FF" stroke-width="4"/>
      <path d="M197 152 C230 130, 272 148, 283 196 C296 253, 276 304, 236 305 C206 306, 192 276, 192 237 L192 165 C192 159, 194 155, 197 152Z"
            fill="url(#accent)" fill-opacity="0.22" stroke="#85F5FF" stroke-width="4"/>
      <path d="M180 92 L180 234" stroke="#85F5FF" stroke-width="5" stroke-linecap="round"/>
      <path d="M180 145 C166 150, 152 160, 143 178" stroke="#85F5FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M180 145 C194 150, 208 160, 217 178" stroke="#85F5FF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- AI nodes around lungs -->
    <g stroke="#4EE7B8" stroke-width="2" opacity="0.9">
      <line x1="92" y1="190" x2="54" y2="165"/>
      <line x1="266" y1="190" x2="306" y2="162"/>
      <line x1="118" y1="292" x2="74" y2="330"/>
      <line x1="240" y1="292" x2="286" y2="330"/>
    </g>
    <g fill="#4EE7B8">
      <circle cx="54" cy="165" r="8"/>
      <circle cx="306" cy="162" r="8"/>
      <circle cx="74" cy="330" r="8"/>
      <circle cx="286" cy="330" r="8"/>
    </g>

    <!-- Risk score mini card -->
    <rect x="72" y="333" width="216" height="72" rx="18" fill="#071B2D" fill-opacity="0.72" stroke="#4EE7B8" stroke-opacity="0.55"/>
    <text x="98" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#B9FFF0">Risk prediction</text>
    <rect x="98" y="379" width="134" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.18"/>
    <rect x="98" y="379" width="88" height="10" rx="5" fill="#4EE7B8"/>
    <text x="246" y="391" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">AI</text>
  </g>

  <!-- Footer citation -->
  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="170" y="570" font-size="17" fill="#BFDCE4">
      Tan WY, Lee TY, Tan KB, et al. BMJ Open 2026;16:e116086 · doi:10.1136/bmjopen-2025-116086
    </text>
  </g>
</svg>